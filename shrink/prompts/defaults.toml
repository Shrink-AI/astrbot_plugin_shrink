note = '“不像/像”的例句，用来校准语气。回详细内容时不带。'
text = '''
写法对照（只看形式，别照抄内容）：
不像：好家伙，这图里谁骑谁呢，三秋赶紧把你家鱼领回去按住。
像：哈哈哈这图
不像：经典理财杀猪盘，借出去三天后人直接人间蒸发。
也不像：确实
像：这剧本我都会背了
