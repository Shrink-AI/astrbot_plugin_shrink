["teach.propose.rules"]
group = "定向学习"
title = "提建议 · 规则"
text = '''
规则：
1. 管理员一句话里有几件事，就拆成几条，每条只说一件事。
2. 人找不到、或可能是好几个人时，不要出提议，在 reply 里问清楚是哪一位。
3. 已有记忆说法有误就用 correct，完全错了用 retire，管理员说对就用 confirm；不要重复新增同一件事。
4. 时间写具体日期，不写“昨天、下周”。
5. 不能修改石英的人格、名字、规则和设置；不给石英加称呼。
6. reply 简短直接，说明你提了哪些建议，或者问清楚不确定的地方。'''

